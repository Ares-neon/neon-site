<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NEON · 3D</title>
<style>
  html, body { margin: 0; background: transparent; }
  body.preview { background: #111; }
  canvas { display: block; }
</style>
<script src="logo-shape.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
/*
  Objetos 3D da NEON, renderizados com fundo transparente.
  Uso: scene.html?obj=logo   (objetos: logo, logo-dark, coin, megaphone, gear, cursor, chart, hook)
  Exportar PNGs: node render-3d.mjs (na pasta instagram/)
*/
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

const NEON = 0x39ff14;
const params = new URLSearchParams(location.search);
const name = params.get("obj") || "logo";
const SIZE = Number(params.get("size") || 1200);
if (params.has("preview")) document.body.classList.add("preview");

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-4, 6, 6); scene.add(key);
const rim = new THREE.DirectionalLight(NEON, 3.5); rim.position.set(6, 2, -5); scene.add(rim);
const fill = new THREE.DirectionalLight(NEON, 0.8); fill.position.set(3, -5, 4); scene.add(fill);

// materiais
const M = {
  neon: () => new THREE.MeshPhysicalMaterial({ color: NEON, emissive: NEON, emissiveIntensity: 0.18, roughness: 0.3, metalness: 0, envMapIntensity: 0.5, clearcoat: 1, clearcoatRoughness: 0.08 }),
  black: () => new THREE.MeshPhysicalMaterial({ color: 0x0d0d0d, roughness: 0.18, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.05 }),
  white: () => new THREE.MeshPhysicalMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.25, roughness: 0.25, clearcoat: 1 }),
  chrome: () => new THREE.MeshPhysicalMaterial({ color: 0xe8e8e8, roughness: 0.12, metalness: 1, clearcoat: 1 }),
  neonMetal: () => new THREE.MeshPhysicalMaterial({ color: NEON, emissive: NEON, emissiveIntensity: 0.1, roughness: 0.3, metalness: 0.5, envMapIntensity: 0.7, clearcoat: 1, clearcoatRoughness: 0.1 }),
  glow: () => new THREE.MeshBasicMaterial({ color: NEON }),
};

const ext = (shape, depth, bevel = 0.04) => {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 6, curveSegments: 48 });
  g.translate(0, 0, -depth / 2);
  return g;
};
const font = () => new Promise(r => new FontLoader().load("https://cdn.jsdelivr.net/npm/three@0.170.0/examples/fonts/helvetiker_bold.typeface.json", r));
const text = (f, s, size, depth) => {
  const g = new TextGeometry(s, { font: f, size, depth, curveSegments: 16, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.02, bevelSegments: 5 });
  g.center();
  return g;
};

// símbolo NEON a partir do contorno traçado do PNG oficial
function logo(dark) {
  const data = window.LOGO_SHAPE;
  const toShape = s => {
    const pts = s.outer.map(([x, y]) => new THREE.Vector2(x * 4, -y * 4));
    const shape = new THREE.Shape(pts);
    s.holes.forEach(h => shape.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x * 4, -y * 4)))));
    return shape;
  };
  const g = new THREE.Group();
  const body = new THREE.Mesh(ext(data.green.map(toShape), 0.32, 0.03), dark ? M.black() : M.neon());
  const bolt = new THREE.Mesh(ext(data.bolt.map(toShape), 0.2, 0.03), M.white());
  bolt.position.z = 0.12;
  g.add(body, bolt);
  // placa hexagonal escura por trás, como no símbolo original
  const hex = new THREE.Shape();
  for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; hex[i ? "lineTo" : "moveTo"](Math.cos(a) * 1.35, Math.sin(a) * 1.35); }
  const plate = new THREE.Mesh(ext(hex, 0.12, 0.03), dark ? M.neon() : M.black());
  const box = new THREE.Box3().setFromObject(body), c = box.getCenter(new THREE.Vector3());
  body.position.sub(c).setZ(0); bolt.position.x -= c.x; bolt.position.y -= c.y;
  plate.position.z = -0.24;
  g.add(plate);
  g.rotation.set(0.12, -0.42, 0.04);
  return g;
}

async function coin() {
  const f = await font();
  const g = new THREE.Group();
  const prof = [[0, -0.12], [0.93, -0.12], [1, -0.07], [1, 0.07], [0.93, 0.12], [0.8, 0.12], [0.76, 0.07], [0, 0.07]].map(([x, y]) => new THREE.Vector2(x, y));
  const make = (s, rot, pos) => {
    const c = new THREE.Group();
    const disc = new THREE.Mesh(new THREE.LatheGeometry(prof, 96), M.neonMetal());
    disc.rotation.x = Math.PI / 2;
    const rs = new THREE.Mesh(text(f, "R$", 0.62, 0.08), M.black());
    rs.position.z = 0.1;
    c.add(disc, rs);
    c.scale.setScalar(s); c.rotation.set(...rot); c.position.set(...pos);
    return c;
  };
  g.add(make(1, [0.25, -0.55, 0.12], [0, 0, 0]));
  g.add(make(0.55, [0.9, 0.5, -0.4], [1.25, 1.05, -0.8]));
  g.add(make(0.42, [-0.5, 0.9, 0.6], [-1.2, 0.95, -0.7]));
  // raio cortando a moeda: a verba queimando
  const bolt = new THREE.Shape([[0.15, 1.2], [-0.45, -0.05], [-0.02, -0.05], [-0.25, -1.2], [0.48, 0.25], [0.04, 0.25]].map(([x, y]) => new THREE.Vector2(x, y)));
  const b = new THREE.Mesh(ext(bolt, 0.16, 0.03), M.white());
  b.position.set(0.95, -0.35, 0.6); b.rotation.set(0.1, -0.5, -0.25); b.scale.setScalar(0.75);
  g.add(b);
  return g;
}

function megaphone() {
  const g = new THREE.Group();
  const prof = [[0.22, -1.1], [0.26, -0.9], [0.4, -0.3], [0.7, 0.35], [0.98, 0.78], [1.02, 0.84]].map(([x, y]) => new THREE.Vector2(x, y));
  const bell = new THREE.LatheGeometry(prof, 96);
  g.add(new THREE.Mesh(bell, Object.assign(M.black(), { side: THREE.FrontSide })));
  g.add(new THREE.Mesh(bell, Object.assign(M.neon(), { side: THREE.BackSide })));
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.06, 24, 96), M.neon());
  rim.rotation.x = Math.PI / 2; rim.position.y = 0.82; g.add(rim);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.32, 48), M.neon()); cap.position.y = -1.22; g.add(cap);
  const handle = new THREE.Mesh(new RoundedBoxGeometry(0.26, 0.75, 0.3, 4, 0.08), M.black());
  handle.position.set(0, -0.55, 0.5); handle.rotation.x = 0.35; g.add(handle);
  // ondas de som
  [1.25, 1.6].forEach((r, i) => {
    const w = new THREE.Mesh(new THREE.TorusGeometry(r, 0.055, 16, 64, Math.PI * 0.55), M.glow());
    w.rotation.set(Math.PI / 2, 0, Math.PI * 0.22); w.position.y = 1.0 + i * 0.25; g.add(w);
  });
  g.rotation.set(0.25, 0.45, -0.75);
  return g;
}

function gear() {
  const teeth = 10, R = 1, r = 0.8;
  const pts = [];
  for (let i = 0; i < teeth; i++) {
    const a = (i / teeth) * Math.PI * 2, s = Math.PI / teeth;
    [[a - s * 0.95, r], [a - s * 0.45, R], [a + s * 0.45, R], [a + s * 0.95, r]].forEach(([t, rr]) => pts.push(new THREE.Vector2(Math.cos(t) * rr, Math.sin(t) * rr)));
  }
  const mk = (scale, mat, pos, rot) => {
    const sh = new THREE.Shape(pts); const hole = new THREE.Path(); hole.absarc(0, 0, 0.36, 0, Math.PI * 2, true); sh.holes.push(hole);
    const m = new THREE.Mesh(ext(sh, 0.32, 0.04), mat); m.scale.setScalar(scale); m.position.set(...pos); m.rotation.set(...rot); return m;
  };
  const g = new THREE.Group();
  g.add(mk(1.15, M.chrome(), [0, 0, 0], [0.35, -0.45, 0.1]));
  g.add(mk(0.68, M.neon(), [1.25, 1.05, -0.3], [0.35, -0.45, 0.3]));
  g.add(mk(0.5, M.black(), [-1.15, -1.05, 0.2], [0.35, -0.45, 0.5]));
  return g;
}

function cursor() {
  const pts = [[0, 0], [0, -1.62], [0.4, -1.24], [0.66, -1.84], [0.94, -1.72], [0.68, -1.13], [1.2, -1.13]].map(([x, y]) => new THREE.Vector2(x, y));
  const g = new THREE.Group();
  const arrow = new THREE.Mesh(ext(new THREE.Shape(pts), 0.28, 0.06), M.black());
  const edgePts = [[-0.12, 0.2], [-0.12, -1.9], [0.38, -1.42], [0.6, -1.98], [1.06, -1.78], [0.84, -1.27], [1.48, -1.25]].map(([x, y]) => new THREE.Vector2(x, y));
  const edge = new THREE.Mesh(ext(new THREE.Shape(edgePts), 0.14, 0.04), M.neon()); edge.position.z = -0.14;
  const a = new THREE.Group(); a.add(arrow, edge); a.position.set(-0.3, 0.9, 0); g.add(a);
  [0.55, 0.9].forEach((r, i) => {
    const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.06, 16, 80, Math.PI * 1.1), i ? M.glow() : M.neon());
    t.position.set(-0.3, 0.9, -0.1); t.rotation.z = Math.PI * 0.5; g.add(t);
  });
  g.rotation.set(0.25, -0.5, 0.15);
  return g;
}

async function chart() {
  const f = await font();
  const g = new THREE.Group();
  const base = new THREE.Mesh(new RoundedBoxGeometry(2.6, 0.18, 1.1, 4, 0.06), M.black()); base.position.y = -1.1; g.add(base);
  [[0.7, M.black()], [1.2, M.neon()], [0.5, M.chrome()], [1.75, M.neon()]].forEach(([h, mat], i) => {
    const b = new THREE.Mesh(new RoundedBoxGeometry(0.42, h, 0.42, 4, 0.08), mat);
    b.position.set(-0.9 + i * 0.6, -1.0 + h / 2, 0); g.add(b);
  });
  const q = new THREE.Mesh(text(f, "?", 1.3, 0.3), M.black()); q.position.set(0.9, 1.35, 0.2); q.rotation.z = -0.15; g.add(q);
  g.rotation.set(0.32, -0.6, 0);
  return g;
}

function hook() {
  const g = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3([[0, 1.6], [0, 0.4], [0, -0.5], [0.12, -0.95], [0.5, -1.15], [0.88, -0.95], [0.98, -0.55], [0.95, -0.2]].map(([x, y]) => new THREE.Vector3(x, y, 0)));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 160, 0.085, 24), M.chrome()));
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.42, 24), M.chrome()); tip.position.set(0.95, 0.0, 0); g.add(tip);
  const barb = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.3, 16), M.chrome()); barb.position.set(0.82, -0.12, 0); barb.rotation.z = 0.7; g.add(barb);
  const eye = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.06, 16, 48), M.chrome()); eye.position.set(0, 1.78, 0); eye.rotation.y = Math.PI / 2; g.add(eye);
  const line = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.6, 12), M.glow()); line.position.set(0, 2.25, 0); g.add(line);
  // isca: o raio NEON preso no anzol
  const bolt = new THREE.Shape([[0.15, 1.2], [-0.45, -0.05], [-0.02, -0.05], [-0.25, -1.2], [0.48, 0.25], [0.04, 0.25]].map(([x, y]) => new THREE.Vector2(x, y)));
  const b = new THREE.Mesh(ext(bolt, 0.22, 0.04), M.neon()); b.scale.setScalar(0.62); b.position.set(0.45, -1.3, 0.15); b.rotation.set(0, -0.3, 0.35); g.add(b);
  g.rotation.set(0.1, -0.55, -0.12);
  return g;
}

const BUILD = { logo: () => logo(false), "logo-dark": () => logo(true), coin, megaphone, gear, cursor, chart, hook };
const obj = await BUILD[name]();
scene.add(obj);

// enquadra o objeto
const sphere = new THREE.Box3().setFromObject(obj).getBoundingSphere(new THREE.Sphere());
obj.position.sub(sphere.center);
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
const dist = sphere.radius / Math.sin(THREE.MathUtils.degToRad(28 / 2)) * 0.92;
camera.position.set(0, 0, dist);
camera.lookAt(0, 0, 0);
renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
