<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NEON · 5 erros que queimam sua verba</title>
<link rel="stylesheet" href="neon.css">
<style>
  /* capa */
  .cover h1 { font-size: 170px; }
  .cover .obj3d.coin { width: 470px; right: -10px; top: 40px; transform: rotate(-6deg); }

  /* capa A: painel de anúncio queimando dinheiro */
  .ads { position: absolute; z-index: 1; left: 84px; top: 160px; width: 700px; padding: 36px 42px 36px; border-radius: 34px;
    background: linear-gradient(160deg, #222 0%, var(--gray) 60%); border: 2px solid rgba(255, 255, 255, .08);
    box-shadow: 0 40px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(57, 255, 20, .12), 0 0 80px rgba(57, 255, 20, .12); transform: rotate(-4deg); }
  .ads .top { display: flex; justify-content: space-between; font: 700 20px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .ads .live { display: flex; align-items: center; gap: 12px; color: var(--neon); }
  .ads .live::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 0 6px rgba(57, 255, 20, .2), 0 0 18px var(--neon); }
  .ads .cols { display: grid; grid-template-columns: auto 1fr; gap: 0; margin-top: 30px; }
  .ads .cols div:first-child { padding-right: 40px; }
  .ads .cols div + div { border-left: 2px solid rgba(255, 255, 255, .1); padding-left: 34px; }
  .ads .k { font: 600 22px/1 var(--body); color: var(--muted); margin-bottom: 14px; }
  .ads .v { font: 800 104px/1 var(--display); white-space: nowrap; }
  .ads .bar { margin-top: 30px; height: 14px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .ads .bar i { display: block; width: 87%; height: 100%; background: var(--neon); box-shadow: 0 0 20px var(--neon); }
  .ads .foot { display: flex; justify-content: space-between; margin-top: 14px; font: 600 20px/1 var(--body); color: var(--muted); }
  .cover .obj3d.coin-a { width: 360px; right: -30px; top: 150px; transform: rotate(-10deg); }

  /* capa B: botão impulsionar + cursor */
  .boost { position: absolute; z-index: 1; left: 84px; top: 280px; padding: 40px 64px; border-radius: 26px; background: var(--gray);
    border: 2px solid rgba(255, 255, 255, .1); font: 700 46px/1 var(--body); box-shadow: 0 40px 80px rgba(0, 0, 0, .6); transform: rotate(-3deg); }
  .cover .obj3d.cursor-b { width: 420px; left: 560px; top: 330px; }

  /* erros */
  .erro .obj3d { width: 540px; right: 10px; top: 120px; }
  .erro h2 { font-size: 122px; margin-bottom: 36px; }
  .erro .body { font: 500 35px/1.4 var(--body); color: var(--muted); max-width: 880px; }
  .fix { margin-top: 48px; border: 2px solid var(--neon); border-radius: 24px; padding: 32px 36px; background: rgba(57, 255, 20, .06); }
  .fix .k { font: 800 19px/1 var(--label); letter-spacing: .2em; text-transform: uppercase; color: var(--neon); margin-bottom: 16px; }
  .fix p { font: 600 33px/1.35 var(--body); }
  .slide.light .fix { border-color: #0A0A0A; background: #0A0A0A; color: #fff; }

  /* final verde */
  .slide.green .pill { background: #0A0A0A; color: var(--neon); box-shadow: none; }
  .cta .obj3d { width: 580px; right: -10px; top: 80px; }
</style>
</head>
<body>
<div id="deck"></div>
<script src="neon.js"></script>
<script>
  const ERROS = [
    {
      t: "Impulsionar em vez de *anunciar*.",
      obj: "megaphone",
      d: "O botão Impulsionar dá pouco controle de objetivo, público e posicionamento. Serve para alcance, não para venda.",
      fix: "Monte a campanha no Gerenciador de Anúncios, com objetivo de mensagem ou de vendas.",
    },
    {
      t: "Mexer na campanha *todo dia*.",
      obj: "gear",
      d: "Cada edição grande reinicia o aprendizado do algoritmo. Você paga a fase mais cara de novo, toda vez.",
      fix: "Espere de 3 a 7 dias antes de julgar um anúncio. E mude uma coisa por vez.",
    },
    {
      t: "Anunciar sem página de *destino*.",
      obj: "cursor",
      d: "O clique custa o mesmo. Se ele cai num perfil bagunçado ou num site lento, a verba vira visita, não venda.",
      fix: "Mande o clique para um destino feito para converter: página rápida ou WhatsApp com mensagem pronta.",
    },
    {
      t: "Não medir o que *importa*.",
      obj: "chart",
      d: "Sem pixel e conversões configurados, o algoritmo otimiza no escuro e você não sabe quanto custa cada cliente.",
      fix: "Instale o pixel, teste os eventos e acompanhe custo por contato. Curtida não paga boleto.",
    },
    {
      t: "Criativo sem *gancho*.",
      obj: "hook",
      d: "Os 3 primeiros segundos decidem se a pessoa para ou rola. Anúncio que abre com logo e vinheta paga para ser pulado.",
      fix: "Comece pelo problema do cliente ou pelo resultado. A marca entra depois.",
    },
  ];

  // três capas para testar: erros.html?capa=a (padrão), b ou c
  const CAPAS = {
    a: {
      h: "Você não tem problema de *verba*.",
      sub: "Tem 5 erros. Arrasta e conta quantos você comete.",
      extra: `
        <div class="ads">
          <div class="top"><span class="live">Campanha ativa</span><span>Hoje</span></div>
          <div class="cols">
            <div><div class="k">Valor gasto</div><div class="v">R$ 312,40</div></div>
            <div><div class="k">Vendas</div><div class="v">0</div></div>
          </div>
          <div class="bar"><i></i></div>
          <div class="foot"><span>Orçamento do dia</span><span>87% usado</span></div>
        </div>
        <img class="obj3d coin-a" src="3d/coin.png" alt="">`,
    },
    b: {
      h: "Usa o botão *Impulsionar*?",
      sub: "Então arrasta. Esse é só o 1º dos 5 erros que queimam sua verba.",
      extra: `<div class="boost">Impulsionar publicação</div><img class="obj3d cursor-b" src="3d/cursor.png" alt="">`,
    },
    c: {
      h: "Seu anúncio paga *clique* que nunca vai comprar.",
      sub: "5 erros que queimam sua verba. E como corrigir cada um.",
      extra: `<img class="obj3d coin" src="3d/coin.png" alt="">`,
    },
  };
  const capaAtual = CAPAS[new URLSearchParams(location.search).get("capa") || "a"];
  const capa = () => slide(1, "cover", `
      <h1>${title(capaAtual.h)}</h1>
      <p class="sub">${fmt(capaAtual.sub)}</p>`, capaAtual.extra);

  const TOTAL = ERROS.length + 2;
  const slide = makeSlide("Tráfego pago", TOTAL);
  const temas = ["", "light", "", "light", ""];

  const slides = [
    capa(),

    ...ERROS.map((e, i) => slide(i + 2, `erro ${temas[i]}`, `
      <div class="label">Erro ${pad2(i + 1)}</div>
      <h2>${title(e.t)}</h2>
      <p class="body">${fmt(e.d)}</p>
      <div class="fix"><div class="k">Como corrigir</div><p>${fmt(e.fix)}</p></div>`,
      `<img class="obj3d" src="3d/${e.obj}.png" alt="">`)),

    slide(TOTAL, "green cta", `
      <div class="label">Diagnóstico grátis em 24h</div>
      <h2>A gente faz isso por <em class="hl">você</em><span class="dot">.</span></h2>
      <p class="sub">A gente olha sua conta de anúncios e mostra onde a verba está vazando.</p>
      <div class="pill">Comenta “diagnóstico” ↗</div>`,
      `<img class="obj3d" src="3d/logo-dark.png" alt="">`, "Link na bio"),
  ];

  document.getElementById("deck").innerHTML = slides.join("");
</script>
</body>
</html>
