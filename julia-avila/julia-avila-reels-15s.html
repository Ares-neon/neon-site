<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julia Ávila Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=block" rel="stylesheet">
<style>
:root{
  --navy:#182142;          /* medido na logo */
  --navy-hi:#1D2850;
  --navy-lo:#141B37;
  --gold:#D6A073;          /* dourado champagne medido na logo */
  --gold-soft:rgba(214,160,115,.6);
  --gold-hair:rgba(214,160,115,.42);
  --ivory:#F8F5EF;
  --serif:"Cormorant Garamond","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d1226;overflow:hidden}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased;color:var(--ivory)}

#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;
  transform:translate(-50%,-50%) scale(var(--s,.4));
  background:radial-gradient(120% 70% at 50% 46%, var(--navy-hi) 0%, var(--navy) 55%, var(--navy-lo) 100%)}
body.render{background:var(--navy)}
body.render #stage{left:0;top:0;transform:none}

.scene{position:absolute;inset:0}
.abs{position:absolute}
.center{left:0;width:1080px;text-align:center}
svg.full{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
.caps{text-transform:uppercase;font-weight:500;letter-spacing:.34em;padding-left:.34em}
.gold{color:var(--gold)}
.it{font-style:italic;font-weight:300}
.w{display:inline-block;will-change:transform,opacity,filter}

/* logo montada a partir das peças originais (coordenadas da logo: centro 645,1077) */
.logo{position:absolute;width:0;height:0}
.logo>*{position:absolute;display:block}
.logo .face{left:-145px;top:-327px;width:300px;height:412px}
.logo .wm{left:-405px;top:43px;width:760px;height:282px}
.logo .bs{left:-245px;top:259px;width:500px;height:62px}

/* Cena 01 */
#face1{position:absolute;left:390px;top:674px;width:300px;height:412px;transform-origin:50% 50%}
#seed{position:absolute;left:539.25px;top:880px;width:1.5px;height:0;background:var(--gold);transform-origin:50% 0}
#wm1{left:540px;top:878px;transform:scale(.88)}

/* Cena 02 */
.photo{position:absolute;left:240px;top:520px;width:600px;height:600px;border-radius:50%;overflow:hidden;clip-path:circle(0% at 50% 50%)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
#s2-word{top:1236px;font-size:150px;font-weight:300;letter-spacing:.16em;padding-left:.16em;line-height:1;color:var(--gold)}

/* Cena 03 */
.s3{line-height:1}
#s3-a{top:702px;font-size:58px}
#s3-b{top:772px;font-size:200px;color:var(--gold);letter-spacing:.01em}
#s3-c{top:1010px;font-size:58px}
.hair-c{position:absolute;left:505px;width:70px;height:1px;background:var(--gold-soft);transform-origin:50% 50%}

/* Cena 04 */
.item{position:absolute;left:0;width:1080px;height:300px}
.item svg{position:absolute;left:480px;top:-16px;width:120px;height:120px;overflow:visible}
.item .num{position:absolute;left:0;width:1080px;top:116px;text-align:center;font-size:26px;font-style:italic;color:var(--gold);letter-spacing:.2em}
.item .num i{display:inline-block;width:46px;height:1px;background:var(--gold-hair);vertical-align:middle;margin:0 18px;transform-origin:50% 50%}
.item .word{position:absolute;left:0;width:1080px;top:150px;text-align:center;font-size:96px;font-weight:400;letter-spacing:.14em;padding-left:.14em;line-height:1}
.vline{position:absolute;left:539.5px;width:1px;height:56px;background:linear-gradient(rgba(214,160,115,0),var(--gold-hair),rgba(214,160,115,0));transform-origin:50% 0}

/* Cena 05/06 */
#logoB{left:540px;top:880px}
#hairB{position:absolute;left:480px;top:1238px;width:120px;height:1px;background:var(--gold);transform-origin:50% 50%}
#handle{top:1076px;font-size:30px;color:var(--gold);letter-spacing:.24em;padding-left:.24em}
#btn{position:absolute;left:375px;top:1152px;width:330px;height:92px;border:1.5px solid var(--gold);border-radius:12px;
  display:flex;align-items:center;justify-content:center;background:rgba(214,160,115,0);
  font-size:30px;font-weight:600;letter-spacing:.38em;padding-left:.38em;color:var(--gold)}
#ripple{position:absolute;left:375px;top:1152px;width:330px;height:92px;border:1px solid var(--gold);border-radius:12px;opacity:0}
#cursor{position:absolute;left:0;top:0;width:46px;height:46px;transform-origin:0 0;opacity:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}

#guides{position:absolute;inset:0;z-index:200;pointer-events:none;display:none}
#guides .zone{position:absolute;left:120px;top:250px;width:840px;height:1250px;outline:2px dashed rgba(255,0,180,.8)}
body.guides #guides{display:block}
#ui{position:fixed;left:16px;bottom:16px;z-index:300;font:13px/1.4 var(--serif);color:#9aa0b8;letter-spacing:.04em}
#ui b{color:#e6d6c6;font-weight:600}
body.render #ui{display:none}
</style>
</head>

  tl.to('#btn', { scale: .955, duration: .1, ease: 'power2.in' }, CLICK);
  tl.to('#btn', { backgroundColor: GOLD, color: NAVY, duration: .22, ease: 'power1.out' }, CLICK + .05);
  tl.to('#btn', { scale: 1, duration: .45, ease: 'power3.out' }, CLICK + .12);
  tl.fromTo('#ripple', { scale: 1, opacity: .55 }, { scale: 1.28, opacity: 0, duration: .8, ease: 'power2.out', immediateRender: false }, CLICK + .08);
  // fechamento: só a assinatura
  tl.to('#cursor', { opacity: 0, y: '+=30', duration: .3, ease: 'power1.in' }, CLICK + .28);
  tl.to(['#btn', '#handle'], { opacity: 0, y: 10, duration: .32, stagger: .03, ease: 'power1.in' }, 14.42);
  tl.to('#logoB', { y: 0, duration: .5, ease: IRIS }, 14.42);
  tl.to('#hairB', { y: 0, scaleX: 1, opacity: 1, duration: .5, ease: IRIS }, 14.42);
  tl.to({}, { duration: .01 }, 14.99);

  /* ---------- boot ---------- */
  const fonts = Promise.all([
    document.fonts.load('500 40px "Cormorant Garamond"'), document.fonts.load('300 40px "Cormorant Garamond"'),
    document.fonts.load('400 40px "Cormorant Garamond"'), document.fonts.load('600 40px "Cormorant Garamond"'),
    document.fonts.load('italic 300 40px "Cormorant Garamond"')
  ]).then(() => document.fonts.ready);
  const imgs = Promise.all($$('img').map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
  Promise.all([fonts, imgs, prepFace()]).then(() => {
    sync();
    window.__seek = t => { tl.seek(t, false); sync(); };
    window.__ready = true;
    if (RENDER) { tl.seek(0); return; }
    tl.eventCallback('onComplete', () => gsap.delayedCall(1.4, () => tl.restart()));
    tl.play(0);
  });

  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); tl.paused(!tl.paused()); }
    if (e.key === 'r' || e.key === 'R') tl.restart();
    if (e.key === 'g' || e.key === 'G') document.body.classList.toggle('guides');
    if (e.key === 'ArrowRight') tl.seek(Math.min(15, tl.time() + .5));
    if (e.key === 'ArrowLeft') tl.seek(Math.max(0, tl.time() - .5));
  });
})();
</script>
</body>
</html>
